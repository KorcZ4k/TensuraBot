name: Discord Bot Continuo

on:
  schedule:
    # Roda a cada 5 horas (Minuto 0, a cada 5 horas)
    - cron: '0 */5 * * *'
  push:
    branches:
      - main  # Altere para a sua branch principal se não for main

# Cancela a execução anterior se um novo push ou agendamento iniciar
concurrency:
  group: discord-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código mais recente
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-python: '3.11' # Altere para a sua versão do Python

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Executar Bot do Discord
      run: python main.py # Substitua pelo arquivo principal do seu bot
env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}