name: Auditoria e correcoes de comandos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit-fix:
    if: github.actor == 'KorcZ4k'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar correcoes estruturais
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def edit(path, transform):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = transform(s)
              if n == s:
                  raise SystemExit(f'Nenhuma alteracao aplicada em {path}')
              p.write_text(n, encoding='utf-8')

          # Luta: eliminar conflitos estruturais, corrigir Party/PvP/PvE e integrar duelo.
          def luta(s):
              s = s.replace('Nao usa monkeypatches encadeados para resolver ataque/defesa.', 'Nao usa substituicoes encadeadas para resolver ataque/defesa.')
              old = '''        participantes = self._ordenar(list(participantes))\n        for p in participantes:\n            p.setdefault("equipe", "jogadores" if p.get("tipo") == "jogador" else "inimigos")\n            p.setdefault("efeitos", [])'''
              new = '''        participantes = self._ordenar(list(participantes))\n        for p in participantes:\n            if pvp and p.get("tipo") == "jogador":\n                p["equipe"] = f"jogador:{p.get('id')}"\n            else:\n                p.setdefault("equipe", "jogadores" if p.get("tipo") == "jogador" else "inimigos")\n            p.setdefault("efeitos", [])'''
              assert old in s
              s = s.replace(old, new, 1)
              old = '''    def _condicao_vitoria(self, combate):\n        jogadores = [p for p in combate["participantes"] if p.get("equipe") == "jogadores" and _vivo(p)]\n        inimigos = [p for p in combate["participantes"] if p.get("equipe") == "inimigos" and _vivo(p)]\n        if jogadores and not inimigos:\n            return "jogadores"\n        if inimigos and not jogadores:\n            return "inimigos"\n        if not jogadores and not inimigos:\n            return "empate"\n        return None\n'''
              new = '''    def _condicao_vitoria(self, combate):\n        if combate.get("pvp"):\n            vivos = [p for p in combate.get("participantes", []) if _vivo(p)]\n            if len(vivos) == 1:\n                return "pvp"\n            if not vivos:\n                return "empate"\n            return None\n        jogadores = [p for p in combate["participantes"] if p.get("equipe") == "jogadores" and _vivo(p)]\n        inimigos = [p for p in combate["participantes"] if p.get("equipe") == "inimigos" and _vivo(p)]\n        if jogadores and not inimigos:\n            return "jogadores"\n        if inimigos and not jogadores:\n            return "inimigos"\n        if not jogadores and not inimigos:\n            return "empate"\n        return None\n'''
              assert old in s
              s = s.replace(old, new, 1)
              old = '''            await run_db(db["Jogadores"].update_one, filtro, {"$inc": {"XP": ganho_xp}})\n            await run_db(db["Hunos"].update_one, filtro, {"$inc": {"carteira": ganho_hunos}}, upsert=True)'''
              new = '''            ganho_tp = max(1, min(2000, ganho_xp)) if ganho_xp > 0 else 0\n            await run_db(db["Jogadores"].update_one, filtro, {"$inc": {"XP": ganho_xp, "TP": ganho_tp}})\n            await run_db(db["Hunos"].update_one, filtro, {"$inc": {"carteira": ganho_hunos}}, upsert=True)'''
              assert old in s
              s = s.replace(old, new, 1)
              marker = '    async def _finalizar(self, ctx, motivo="vida", vencedor=None, perdedor=None):\n'
              helper = '''    async def _finalizar_duelo_assentamento(self, ctx, vencedor, perdedor):\n        combate = self._obter_combate(ctx.channel.id)\n        if not combate:\n            return\n        combate["ativo"] = False\n        combate["fase"] = "finalizado"\n        combate["aguardando_finalizacao"] = False\n        combate["vencedor_id"] = str(vencedor.get("id"))\n        combate["perdedor_id"] = str(perdedor.get("id"))\n        for participante in combate.get("participantes", []):\n            participante.pop("_duelo_vitoria_pendente", None)\n            participante.pop("_duelo_assentamento", None)\n        await self._salvar(combate)\n        try:\n            if db is not None:\n                await run_db(\n                    db["Evento"].update_one,\n                    {"tipo": "assentamento", "guild_id": str(combate.get("guild_id")), "canal_id": str(combate.get("assentamento_canal_id"))},\n                    {"$set": {"DONO": str(vencedor.get("id")), "data_posse": discord.utils.utcnow().strftime("%d/%m/%Y"), "hora_posse": discord.utils.utcnow().strftime("%H:%M:%S")}, "$inc": {"derrotados": 1, "pessoas_derrotadas": 1}},\n                    upsert=True,\n                )\n        except Exception as erro:\n            print(f"[LUTA][ASSENTAMENTO][ERRO] {type(erro).__name__}: {erro}")\n        await ctx.send(embed=discord.Embed(\n            title="🏰 | Assentamento conquistado!",\n            description=f"👑 **{vencedor.get('nome', 'Jogador')}** venceu o duelo contra **{perdedor.get('nome', 'o adversário')}** e agora é o dono do assentamento.\\n\\n❤️ O duelo foi não letal; o derrotado ficou com **1 HP**.",\n            color=discord.Color.gold(),\n        ))\n        self.combates.pop(ctx.channel.id, None)\n\n'''
              assert marker in s
              s = s.replace(marker, helper + marker, 1)
              old = '''        xp = hunos = 0\n        if resultado == "jogadores":\n            xp, hunos = await self._recompensar(combate)\n            descricao = "🏆 Os jogadores venceram o combate!"\n        elif resultado == "inimigos":\n            descricao = "💀 Os jogadores foram derrotados."\n        else:\n            descricao = "⚖️ O combate terminou em empate."'''
              new = '''        xp = hunos = 0\n        if combate.get("pvp"):\n            descricao = f"💀 **{vencedor.get('nome')}** finalizou **{perdedor.get('nome')}** ({motivo})." if vencedor and perdedor else "⚖️ O combate PvP terminou em empate."\n        elif resultado == "jogadores":\n            xp, hunos = await self._recompensar(combate)\n            descricao = "🏆 Os jogadores venceram o combate!"\n        elif resultado == "inimigos":\n            descricao = "💀 Os jogadores foram derrotados."\n        else:\n            descricao = "⚖️ O combate terminou em empate."'''
              assert old in s
              s = s.replace(old, new, 1)
              old = '''            if ataque.get("tipo") == "magia" and ataque.get("cura_base", 0) > 0:'''
              new = '''            duelo_pendente = False\n            if ataque.get("tipo") == "magia" and ataque.get("cura_base", 0) > 0:'''
              assert old in s
              s = s.replace(old, new, 1)
              old = '''                else:\n                    defensor["vida"] = max(0, int(_num(defensor.get("vida")) - dano))\n                    mensagem = f"✨ **{atacante.get('nome')}** causou **{dano} de dano mágico** em **{defensor.get('nome')}**."'''
              new = '''                else:\n                    vida_antes = int(_num(defensor.get("vida")))\n                    if combate.get("assentamento_duelo") and dano >= vida_antes:\n                        dano = max(0, vida_antes - 1)\n                        duelo_pendente = True\n                    defensor["vida"] = max(0, vida_antes - dano)\n                    mensagem = f"✨ **{atacante.get('nome')}** causou **{dano} de dano mágico** em **{defensor.get('nome')}**."'''
              assert old in s
              s = s.replace(old, new, 1)
              old = '''                else:\n                    defensor["vida"] = max(0, int(_num(defensor.get("vida")) - dano))\n                    mensagem = f"⚔️ **{atacante.get('nome')}** causou **{dano} de dano** em **{defensor.get('nome')}**."'''
              new = '''                else:\n                    vida_antes = int(_num(defensor.get("vida")))\n                    if combate.get("assentamento_duelo") and dano >= vida_antes:\n                        dano = max(0, vida_antes - 1)\n                        duelo_pendente = True\n                    defensor["vida"] = max(0, vida_antes - dano)\n                    mensagem = f"⚔️ **{atacante.get('nome')}** causou **{dano} de dano** em **{defensor.get('nome')}**."'''
              assert old in s
              s = s.replace(old, new, 1)
              old = '''            combate["historico"].append(mensagem)\n            defensor["defesa_ativa"] = False'''
              new = '''            if combate.get("assentamento_duelo") and defensor.get("vida", 0) <= 0:\n                defensor["vida"] = 1\n                duelo_pendente = True\n            combate["historico"].append(mensagem)\n            defensor["defesa_ativa"] = False'''
              assert old in s
              s = s.replace(old, new, 1)
              old = '''            resultado = self._condicao_vitoria(combate)\n            if resultado:\n                await self._finalizar(ctx, motivo="vida", vencedor=atacante, perdedor=defensor)\n                return'''
              new = '''            if combate.get("assentamento_duelo") and duelo_pendente:\n                await self._finalizar_duelo_assentamento(ctx, atacante, defensor)\n                return\n            if combate.get("pvp") and not _vivo(defensor):\n                combate["aguardando_finalizacao"] = True\n                combate["vencedor_id"] = str(atacante.get("id"))\n                combate["perdedor_id"] = str(defensor.get("id"))\n                combate["fase"] = "finalizacao"\n                await ctx.send(f"⚔️ **{atacante.get('nome')}** venceu o turno decisivo. Use `!matar` ou `!desmaiar` para finalizar o PvP.")\n                return\n            resultado = self._condicao_vitoria(combate)\n            if resultado and not combate.get("pvp"):\n                await self._finalizar(ctx, motivo="vida", vencedor=atacante, perdedor=defensor)\n                return'''
              assert old in s
              s = s.replace(old, new, 1)
              s = s.replace('async def luta_pve(self, ctx, monstro_tipo: str):', 'async def luta_pve(self, ctx, *, monstro_tipo: str):', 1)
              # Remove the public reset command; the administrative Cog owns !rluta.
              s = re.sub(r'\n    @commands\.command\(name="rluta", aliases=\["resetarluta"\]\)\n    async def rluta\(self, ctx\):\n(?:        .*\n){0,8}', '\n', s, count=1)
              return s

          edit('comandos/RPG/luta.py', luta)

          # Party players must remain on the player side of PvE victory detection.
          edit('comandos/RPG/party.py', lambda s: s.replace('jogador["equipe"] = "party"', 'jogador["equipe"] = "jogadores"'))

          # The balance extension remains the monster factory adapter; it must not replace
          # the canonical PvE command with a callback that references removed methods.
          def balance(s):
              s = re.sub(r'\nasync def _pve_corrigido\(.*?\n\ndef _instalar_pve_corrigido\(.*?\n\n', '\n', s, flags=re.S)
              s = s.replace('    _instalar_pve_corrigido(bot)\n', '')
              return s
          edit('comandos/RPG/monstros_balanceamento.py', balance)

          # Assentamentos use the canonical non-lethal combat path instead of monkeypatching Luta.
          def assentamentos(s):
              s = re.sub(r'\n_LUTA_PATCHED = False.*?\n\nasync def _get_assentamento', '\n\nasync def _get_assentamento', s, flags=re.S)
              s = re.sub(r'\n\ndef _eh_duelo\(combate\):.*?\n\nclass Duelo', '\n\nclass Duelo', s, flags=re.S)
              s = s.replace('        _instalar_protecao_nao_letal()\n', '')
              s = s.replace('            luta._atualizar_situacao(jogador["id"], str(ctx.guild.id), "ativo_combate")', '            await luta._marcar_combate(participantes, str(ctx.guild.id), "ativo_combate")')
              return s
          edit('comandos/RPG/assentamentos.py', assentamentos)

          # Evento de monstros must use the canonical async state transition.
          edit('comandos/RPG/evento_monstros.py', lambda s: s.replace('            luta._atualizar_situacao(jogador["id"], str(guild.id), "ativo_combate")', '            await luta._marcar_combate([jogador], str(guild.id), "ativo_combate")'))

          # Progressao no longer monkeypatches a non-existent reward method; rewards are canonical in Luta.
          def progressao(s):
              s = re.sub(r'\n    def _patch_luta\(self\):.*?\n\n    @commands\.command\(name="aumentar"', '\n    @commands.command(name="aumentar"', s, flags=re.S)
              s = re.sub(r'\n    @commands\.Cog\.listener\(\)\n    async def on_ready\(self\):\n        self\._patch_luta\(\)\n', '\n', s)
              s = s.replace('    @commands.command(name="aumentar")', '    @commands.command(name="aumentar")\n    @commands.guild_only()', 1)
              s = s.replace('    @commands.command(name="tp", aliases=["pontos", "pontostreinamento"])', '    @commands.command(name="tp", aliases=["pontos", "pontostreinamento"])\n    @commands.guild_only()', 1)
              return s
          edit('comandos/RPG/progressao.py', progressao)
          PY
      - name: Validar e testar
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commitar correcoes
        run: |
          rm -f .github/workflows/auditoria-comandos.yml
          git config user.name 'KorcZ4k'
          git config user.email 'contaparameulove@gmail.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Corrigir arquitetura e fluxos dos comandos'
          git push origin HEAD:main
