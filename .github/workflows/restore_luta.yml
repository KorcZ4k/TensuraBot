name: Restaurar luta_sync

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, 'RESTORE_LUTA_SYNC') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar luta_sync.py do commit íntegro
        run: |
          git checkout 66ca40a31f0b76ad8b062abf21db2bd699e63eec -- comandos/RPG/luta_sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comandos/RPG/luta_sync.py
          git commit -m "RESTORE_LUTA_SYNC restaurar motor completo de combate"
          git push
